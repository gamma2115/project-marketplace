<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectMarket - Buy & Sell Projects</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs (compat version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">ProjectMarket</h1>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="#projects">Projects</a>
                <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
                <button id="auth-button" class="btn-primary">Login</button>
            </div>
        </div>
    </nav>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h2>Buy & Sell Amazing Projects</h2>
                <p>Discover unique projects or sell your own creations</p>
                <button id="browse-projects" class="btn-large" onclick="document.getElementById('featured-projects').scrollIntoView({behavior: 'smooth'})">Browse Projects</button>
            </div>
        </section>

        <section id="featured-projects" class="projects-section">
            <div class="container">
                <h3>Featured Projects</h3>
                <div class="project-grid" id="project-list">
                    <div class="loading">Loading projects...</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 ProjectMarket. All rights reserved.</p>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
