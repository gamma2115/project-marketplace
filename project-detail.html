<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - ProjectMarket</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .project-detail {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .project-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }
        
        .project-image img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .project-info h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        
        .project-price {
            font-size: 2rem;
            color: #27ae60;
            font-weight: bold;
        }
        
        .btn-buy, .btn-cart {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 15px;
        }
        
        .btn-buy {
            background: #27ae60;
            color: white;
        }
        
        .btn-cart {
            background: #3498db;
            color: white;
        }
        
        .project-description {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
</head>
